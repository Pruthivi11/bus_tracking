<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Login – Commute Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#020d1f">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-login">

  <!-- Background orbs (decorative) -->
  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon"><i class="fa-solid fa-bus"></i></div>
      Commute Assistant
    </a>
  </nav>

  <!-- MAIN -->
  <main>
    <div class="login-wrapper">

      <!-- HEADER -->
      <div class="login-header">
        <!-- login-icon-admin applies the purple gradient via style.css -->
        <div class="login-icon login-icon-admin">
          <i class="fa-solid fa-shield-halved"></i>
        </div>
        <h1 class="login-title">Admin Login</h1>
        <p class="login-subtitle">Restricted access. Enter the admin password to continue.</p>
      </div>

      <!-- CARD -->
      <div class="login-card">

        <!-- Flask server-side error -->
        {% if error %}
        <div class="flask-error">
          <i class="fa-solid fa-circle-exclamation"></i>
          {{ error }}
        </div>
        {% endif %}

        <form method="POST" action="/admin_login" id="adminLoginForm">

          <div class="form-group">
            <label class="form-label" for="password">Admin Password</label>
            <div class="input-wrap">
              <i class="fa-solid fa-lock input-icon"></i>
              <input
                class="form-input"
                type="password"
                name="password"
                id="password"
                placeholder="Enter admin password"
                required
                autocomplete="current-password"
              >
              <!-- btn-pwd-toggle handles all positioning via style.css -->
              <button
                type="button"
                id="togglePwd"
                class="btn-pwd-toggle"
                onclick="togglePassword()"
                aria-label="Toggle password visibility"
              >
                <i class="fa-solid fa-eye" id="eyeIcon"></i>
              </button>
            </div>
          </div>

          <div class="divider"></div>

          <!-- btn-primary-admin applies the purple gradient via style.css -->
          <button type="submit" class="btn-primary btn-primary-admin">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
            Access Dashboard
          </button>

        </form>

      </div>

      <a href="/" class="back-link">
        <i class="fa-solid fa-arrow-left"></i>
        Back to Home
      </a>

    </div>
  </main>

  <footer>&copy; 2026 Commute Assistant</footer>

  <script>
  function togglePassword() {
    const input = document.getElementById('password');
    const icon  = document.getElementById('eyeIcon');
    const btn   = document.getElementById('togglePwd');

    if (input.type === 'password') {
      input.type     = 'text';
      icon.className = 'fa-solid fa-eye-slash';
      btn.setAttribute('aria-label', 'Hide password');
    } else {
      input.type     = 'password';
      icon.className = 'fa-solid fa-eye';
      btn.setAttribute('aria-label', 'Show password');
    }
  }
  </script>

</body>
</html>
