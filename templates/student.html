
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Student Dashboard | Bus Tracking System</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link rel="stylesheet" href="/static/style.css">
<link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet"/>

<style>
.toggle-row{
display:flex;
gap:15px;
margin-bottom:10px;
}

.reminder-box{
margin-top:10px;
display:none;
}
</style>

</head>

<body>

<header class="navbar">
<h1>Bus Tracking System</h1>
</header>

<div class="card">

<h2>Student Dashboard</h2>

<label>Trip</label>

<div class="toggle-row">
<label><input type="radio" name="tripMode" value="morning" checked> Morning</label>
<label><input type="radio" name="tripMode" value="evening"> Evening</label>
</div>

<label for="rollNo">Roll Number</label>
<input id="rollNo" placeholder="Roll Number">

<label for="busNo">Bus Number</label>
<input id="busNo" placeholder="Bus Number">

<div id="destinationBlock" style="display:none">

<label>Destination</label>
<button id="selectDestination">Select Destination on Map</button>

<div class="reminder-box" id="reminderBox">

<p style="font-weight:bold">Reminder</p>

<label><input type="checkbox" id="rem2km"> 2 km</label><br>
<label><input type="checkbox" id="rem1km"> 1 km</label><br>
<label><input type="checkbox" id="rem500m"> 500 m</label>

</div>

</div>

<button id="showMap">Show Map</button>

<p id="statusMsg" style="color:#0077cc;font-weight:bold;margin-top:10px;"></p>

</div>

<div id="map" style="display:none;width:100%;height:65vh;"></div>

<footer class="footer">
<p>&copy; 2026 College Transport</p>
</footer>

<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<script src="/static/student.js"></script>

</body>
</html>
