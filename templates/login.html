<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bus Tracking System - Driver Login</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="navbar">
  <h1>Bus Tracking System</h1>
</header>

<div class="card">
  <h2>Driver Login</h2>

  <!-- OTP STATUS -->
  <p id="otpStatus" style="color: green;"></p>

  <form method="POST" action="/driver_login" id="loginForm">
    
    <label for="phone">Phone Number</label>
    <input name="phone" id="phone" placeholder="Phone Number" required>

    <button type="button" id="otpBtn" onclick="sendOTP()">Send OTP</button>

    <label for="otp">Enter OTP</label>
    <input name="otp" id="otp" placeholder="Enter OTP" required>

    <button type="submit">Login</button>
  </form>
</div>

<footer class="footer">
  <p>&copy; 2026 College Transport</p>
</footer>

<script>
async function sendOTP() {
  const phone = document.getElementById('phone').value;
  const status = document.getElementById('otpStatus');
  const btn = document.getElementById('otpBtn');

  if (!phone) {
    alert("Enter phone number");
    return;
  }

  btn.disabled = true;
  status.innerText = "Sending OTP...";

  try {
    const res = await fetch("/send_otp", {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ phone: phone })
    });

    const data = await res.json();

    if (data.msg) {
      status.innerHTML = data.msg + "<br><b>Your OTP: " + data.otp + "</b>";
    }
    else if (data.error) {
      status.innerText = data.error;
      btn.disabled = false;
    }
    else {
      status.innerText = "OTP failed";
      btn.disabled = false;
    }

  } catch (err) {
    console.error(err);
    status.innerText = "Server error while sending OTP";
    btn.disabled = false;
  }
}
</script>

</body>
</html>
