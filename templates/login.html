<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Driver Login – Commute Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #0a6cdc;
      --blue-light: #3d8ef5;
      --blue-pale: #e8f2ff;
      --teal: #00bfa5;
      --green: #1db97a;
      --white: #ffffff;
      --gray-50: #f7faff;
      --gray-100: #edf2fb;
      --gray-200: #d5dfe8;
      --gray-400: #8a9ab5;
      --gray-600: #4a5568;
      --gray-800: #1e2535;
      --navy: #0a2540;
      --shadow-md: 0 8px 32px rgba(10,44,128,0.12);
      --shadow-lg: 0 20px 60px rgba(10,44,128,0.18);
      --radius: 16px;
      --radius-sm: 10px;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: var(--font-body);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      background: linear-gradient(135deg, #020d1f 0%, #061a3a 50%, #0a3060 100%);
      position: relative;
      overflow-x: hidden;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-14px); }
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      20%, 60% { transform: translateX(-6px); }
      40%, 80% { transform: translateX(6px); }
    }

    .bg-orb {
      position: fixed;
      border-radius: 50%;
      filter: blur(90px);
      opacity: 0.15;
      animation: float 8s ease-in-out infinite;
      pointer-events: none;
    }
    .orb-1 { width: 400px; height: 400px; background: var(--blue); top: -100px; right: -100px; }
    .orb-2 { width: 300px; height: 300px; background: var(--teal); bottom: -80px; left: -80px; animation-delay: -4s; }

    /* NAVBAR */
    .navbar {
      position: relative;
      z-index: 10;
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.07);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 18px;
      color: white;
      text-decoration: none;
    }
    .brand-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 15px;
    }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 40px 16px;
      position: relative;
      z-index: 2;
    }

    .login-wrapper {
      width: 100%;
      max-width: 440px;
      animation: fadeUp 0.6s ease both;
    }

    .login-header {
      text-align: center;
      margin-bottom: 32px;
    }
    .login-icon {
      width: 64px; height: 64px;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 26px;
      color: white;
      margin: 0 auto 18px;
      box-shadow: 0 8px 24px rgba(10,108,220,0.4);
    }
    .login-title {
      font-family: var(--font-display);
      font-size: 28px;
      font-weight: 700;
      color: white;
      margin-bottom: 8px;
    }
    .login-subtitle {
      font-size: 14px;
      color: rgba(255,255,255,0.45);
    }

    /* CARD */
    .login-card {
      background: rgba(255,255,255,0.06);
      backdrop-filter: blur(20px);
      border: 1px solid rgba(255,255,255,0.1);
      border-radius: var(--radius);
      padding: 36px;
      box-shadow: var(--shadow-lg);
    }

    /* OTP STATUS */
    .otp-status {
      display: none;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      border-radius: var(--radius-sm);
      font-size: 14px;
      font-weight: 500;
      margin-bottom: 20px;
      animation: fadeUp 0.3s ease both;
    }
    .otp-status.success {
      display: flex;
      background: rgba(29,185,122,0.15);
      border: 1px solid rgba(29,185,122,0.3);
      color: #4ade80;
    }
    .otp-status.error {
      display: flex;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      color: #f87171;
    }
    .otp-box {
      margin-top: 8px;
      padding: 8px 12px;
      background: rgba(0,0,0,0.3);
      border-radius: 6px;
      font-size: 22px;
      font-family: var(--font-display);
      font-weight: 700;
      color: #7bffd8;
      letter-spacing: 6px;
      text-align: center;
    }

    /* FORM */
    .form-group { margin-bottom: 20px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: rgba(255,255,255,0.5);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: rgba(255,255,255,0.3);
      font-size: 14px;
      pointer-events: none;
    }
    .form-input {
      width: 100%;
      padding: 14px 16px 14px 42px;
      background: rgba(255,255,255,0.07);
      border: 1.5px solid rgba(255,255,255,0.12);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 15px;
      color: white;
      outline: none;
      transition: var(--transition);
    }
    .form-input::placeholder { color: rgba(255,255,255,0.25); }
    .form-input:focus {
      border-color: var(--blue-light);
      background: rgba(255,255,255,0.1);
      box-shadow: 0 0 0 4px rgba(10,108,220,0.15);
    }
    .form-input.shake { animation: shake 0.4s ease; }

    /* OTP BUTTON */
    .otp-btn {
      width: 100%;
      padding: 14px;
      background: rgba(255,255,255,0.08);
      border: 1.5px solid rgba(255,255,255,0.15);
      border-radius: var(--radius-sm);
      color: rgba(255,255,255,0.8);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .otp-btn:hover:not(:disabled) {
      background: rgba(10,108,220,0.2);
      border-color: var(--blue-light);
      color: white;
    }
    .otp-btn:disabled { opacity: 0.45; cursor: not-allowed; }

    /* SUBMIT BUTTON */
    .btn-primary {
      width: 100%;
      padding: 16px;
      background: linear-gradient(135deg, var(--blue) 0%, #0052b0 100%);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-display);
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      box-shadow: 0 4px 20px rgba(10,108,220,0.4);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-primary:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(10,108,220,0.55);
    }
    .btn-primary:active { transform: translateY(0); }

    .divider {
      height: 1px;
      background: rgba(255,255,255,0.08);
      margin: 24px 0;
    }

    .back-link {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      color: rgba(255,255,255,0.35);
      font-size: 13px;
      text-decoration: none;
      transition: var(--transition);
      margin-top: 20px;
    }
    .back-link:hover { color: rgba(255,255,255,0.7); }

    /* Error message from Flask */
    .flask-error {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 12px 16px;
      background: rgba(239,68,68,0.12);
      border: 1px solid rgba(239,68,68,0.25);
      border-radius: var(--radius-sm);
      color: #f87171;
      font-size: 14px;
      margin-bottom: 20px;
    }

    footer {
      text-align: center;
      padding: 16px;
      color: rgba(255,255,255,0.2);
      font-size: 12px;
      position: relative;
      z-index: 2;
    }

    @media (max-width: 480px) {
      .login-card { padding: 24px 20px; }
      .navbar { padding: 0 16px; }
    }
  </style>
</head>
<body>

  <div class="bg-orb orb-1"></div>
  <div class="bg-orb orb-2"></div>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon"><i class="fa-solid fa-bus"></i></div>
      Commute Assistant
    </a>
  </nav>

  <!-- MAIN -->
  <main>
    <div class="login-wrapper">

      <div class="login-header">
        <div class="login-icon"><i class="fa-solid fa-steering-wheel"></i></div>
        <h1 class="login-title">Driver Login</h1>
        <p class="login-subtitle">Authorized drivers only. OTP sent to your registered number.</p>
      </div>

      <div class="login-card">

        <!-- Flask error message -->
        {% if error %}
        <div class="flask-error">
          <i class="fa-solid fa-circle-exclamation"></i>
          {{ error }}
        </div>
        {% endif %}

        <!-- OTP Status (JS-populated) -->
        <div id="otpStatus" class="otp-status"></div>

        <form method="POST" action="/driver_login" id="loginForm">

          <!-- PHONE -->
          <div class="form-group">
            <label class="form-label" for="phone">Phone Number</label>
            <div class="input-wrap">
              <i class="fa-solid fa-phone input-icon"></i>
              <input class="form-input" type="tel" name="phone" id="phone"
                     placeholder="10-digit registered number" required>
            </div>
          </div>

          <!-- SEND OTP -->
          <button type="button" class="otp-btn" id="otpBtn" onclick="sendOTP()">
            <i class="fa-solid fa-paper-plane"></i>
            Send OTP to My Number
          </button>

          <!-- OTP INPUT -->
          <div class="form-group">
            <label class="form-label" for="otp">Enter OTP</label>
            <div class="input-wrap">
              <i class="fa-solid fa-key input-icon"></i>
              <input class="form-input" type="text" name="otp" id="otp"
                     placeholder="4-digit OTP" maxlength="4" required>
            </div>
          </div>

          <div class="divider"></div>

          <button type="submit" class="btn-primary">
            <i class="fa-solid fa-arrow-right-to-bracket"></i>
            Login to Driver Panel
          </button>

        </form>

      </div>

      <a href="/" class="back-link">
        <i class="fa-solid fa-arrow-left"></i>
        Back to Home
      </a>

    </div>
  </main>

  <footer>&copy; 2026 Commute Assistant</footer>

  <script>
  async function sendOTP() {
    const phone = document.getElementById('phone').value;
    const statusEl = document.getElementById('otpStatus');
    const btn = document.getElementById('otpBtn');

    if (!phone) {
      document.getElementById('phone').classList.add('shake');
      setTimeout(() => document.getElementById('phone').classList.remove('shake'), 400);
      return;
    }

    btn.disabled = true;
    btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Sending…';
    statusEl.className = 'otp-status';
    statusEl.style.display = 'none';

    try {
      const res = await fetch("/send_otp", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ phone: phone })
      });

      const data = await res.json();

      if (data.msg) {
        statusEl.className = 'otp-status success';
        statusEl.style.display = 'flex';
        statusEl.innerHTML = `
          <i class="fa-solid fa-circle-check"></i>
          <div>
            OTP Generated Successfully
            <div class="otp-box">${data.otp}</div>
          </div>
        `;
        btn.innerHTML = '<i class="fa-solid fa-check"></i> OTP Sent';
      } else {
        statusEl.className = 'otp-status error';
        statusEl.style.display = 'flex';
        statusEl.innerHTML = `<i class="fa-solid fa-circle-xmark"></i> ${data.error || 'OTP failed'}`;
        btn.disabled = false;
        btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send OTP to My Number';
      }
    } catch (err) {
      statusEl.className = 'otp-status error';
      statusEl.style.display = 'flex';
      statusEl.innerHTML = '<i class="fa-solid fa-circle-xmark"></i> Server error. Please try again.';
      btn.disabled = false;
      btn.innerHTML = '<i class="fa-solid fa-paper-plane"></i> Send OTP to My Number';
    }
  }
  </script>

</body>
</html>
