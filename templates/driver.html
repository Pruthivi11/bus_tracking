<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Driver Panel – Commute Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7faff">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-driver">

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon"><i class="fa-solid fa-bus"></i></div>
      Commute Assistant
    </a>
    <div class="nav-right">
      <span class="nav-pill driver-mode">
        <i class="fa-solid fa-steering-wheel"></i>&nbsp;Driver
      </span>
    </div>
  </nav>

  <main>
    <div class="panel-wrapper">

      <!-- TRIP STATUS BANNER -->
      <div id="tripStatus" class="trip-status-banner idle">
        <div class="status-icon"><i class="fa-solid fa-bus-simple"></i></div>
        <div>
          <div class="status-text-row">
            TRIP NOT STARTED
            <span class="live-dot"></span>
          </div>
          <div class="status-sub-text">Set route and start tracking</div>
        </div>
      </div>

      <!-- DRIVER CARD -->
      <div class="driver-card">

        <div class="card-header">
          <h2>Driver Trip Panel</h2>
          <p>Configure your route and start sharing live location</p>
        </div>

        <div class="card-body">

          <!-- ── ROUTE NUMBER ─────────────────────────────────────
               Driver enters bus number (e.g. "12").
               On input/blur, /get-route autofills the Route Area field
               with the matching area from bus_details.
          ──────────────────────────────────────────────────────── -->
          <div class="form-group">
            <label class="form-label" for="routeNo">Route Number</label>
            <div class="input-wrap">
              <i class="fa-solid fa-hashtag input-icon"></i>
              <input
                id="routeNo"
                class="form-input"
                type="text"
                inputmode="numeric"
                placeholder="Enter Route number"
                autocomplete="off"
                maxlength="10"
              >
              <!-- Spinner shown while /get-route is fetching -->
              <span
                id="routeLoadingIcon"
                class="route-loading-indicator"
                aria-hidden="true"
              ></span>
            </div>
          </div>

          <!-- ── ROUTE AREA ─────────────────────────────────────
               Auto-filled from bus_details when route number is entered.
               Driver can type to search all known routes — a dropdown
               of matching options appears from the dataset.
               Selecting from the dropdown (or keeping the autofill)
               sets the final route area sent with location updates.
          ──────────────────────────────────────────────────────── -->
          <div class="form-group">
            <label class="form-label" for="routeArea">Route Area</label>

            <!--
              route-area-wrap is position:relative so the dropdown
              positions itself directly below the input.
            -->
            <div class="route-area-wrap">
              <div class="input-wrap">
                <i class="fa-solid fa-map-location-dot input-icon"></i>
                <input
                  id="routeArea"
                  class="form-input"
                  type="text"
                  placeholder="Auto-filled — or type to search"
                  autocomplete="off"
                  aria-autocomplete="list"
                  aria-controls="routeAreaDropdown"
                  aria-expanded="false"
                >
              </div>

              <!--
                Autocomplete dropdown — populated dynamically by driver.js.
                Items come only from the bus_details dataset (/routes endpoint).
                Hidden by default; .open class makes it visible.
              -->
              <ul
                id="routeAreaDropdown"
                class="route-dropdown"
                role="listbox"
                aria-label="Route area suggestions"
              ></ul>
            </div>
          </div>

          <!-- BUS TYPE -->
          <div class="form-group">
            <label class="form-label" for="busType">Bus Type</label>
            <div class="input-wrap">
              <i class="fa-solid fa-bus input-icon"></i>
              <select id="busType" class="form-input">
                <option value="">Select Bus Type</option>
                <option value="boys">Boys</option>
                <option value="girls">Girls</option>
                <option value="common">Common</option>
              </select>
            </div>
          </div>

          <div class="divider"></div>

          <!-- TRIP CONTROLS -->
          <div class="btn-row">
            <button id="startBtn" class="btn-start" onclick="startTrip()">
              <i class="fa-solid fa-play"></i> Start Trip
            </button>
            <button id="endBtn" class="btn-end" onclick="endTrip()" disabled>
              <i class="fa-solid fa-stop"></i> End Trip
            </button>
          </div>

          <button class="btn-logout" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </button>

        </div>
      </div>

    </div>
  </main>

  <footer>&copy; 2026 Commute Assistant</footer>

  <!--
    BASE_URL is set by Flask from the BACKEND_URL env var.
    Must appear before driver.js so BASE_URL is defined when that script runs.
    Empty string = same-origin. Set BACKEND_URL env var for cross-origin deployments.
  -->
  <script>
    window.BASE_URL = "{{ backend_url | default('') }}";
  </script>

  <script src="/static/driver.js"></script>

  <!-- Override setStatus to drive the styled status banner -->
  <script>
  function setStatus(text, color) {
    const banner   = document.getElementById("tripStatus");
    const liveText = banner.querySelector(".status-text-row");
    const subText  = banner.querySelector(".status-sub-text");

    banner.classList.remove("idle", "active", "ended");

    if (color === "#09f443" || color === "green") {
      banner.classList.add("active");
      liveText.innerHTML  = 'TRIP ACTIVE <span class="live-dot"></span>';
      subText.textContent = "Broadcasting live location to students";
    } else if (color === "#dc3545" || color === "red") {
      banner.classList.add("ended");
      liveText.innerHTML  = "TRIP ENDED";
      subText.textContent = "Trip has been stopped. GPS cleared.";
    } else {
      banner.classList.add("idle");
      liveText.innerHTML  = text;
      subText.textContent = "Set route and start tracking";
    }
  }
  </script>

</body>
</html>
