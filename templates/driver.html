<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Driver Panel – Commute Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f7faff">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-driver">

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon"><i class="fa-solid fa-bus"></i></div>
      Commute Assistant
    </a>
    <div class="nav-right">
      <span class="nav-pill driver-mode">
        <i class="fa-solid fa-steering-wheel"></i>&nbsp;Driver
      </span>
    </div>
  </nav>

  <main>
    <div class="panel-wrapper">

      <!-- TRIP STATUS BANNER -->
      <div id="tripStatus" class="trip-status-banner idle">
        <div class="status-icon"><i class="fa-solid fa-bus-simple"></i></div>
        <div>
          <div class="status-text-row">
            TRIP NOT STARTED
            <span class="live-dot"></span>
          </div>
          <div class="status-sub-text">Set route and start tracking</div>
        </div>
      </div>

      <!-- DRIVER CARD -->
      <div class="driver-card">

        <div class="card-header">
          <h2>Driver Trip Panel</h2>
          <p>Configure your route and start sharing live location</p>
        </div>

        <div class="card-body">

          <!-- GPS hint -->
          <div class="gps-bar">
            <i class="fa-solid fa-location-crosshairs gps-icon"></i>
            <span>GPS activates automatically when you start the trip</span>
          </div>

          <!-- ROUTE -->
          <div class="form-group">
            <label class="form-label" for="route">Route Number</label>
            <div class="input-wrap">
              <i class="fa-solid fa-route input-icon"></i>
              <input id="route" class="form-input" placeholder="e.g. Route 12"
                     autocomplete="off" inputmode="text">
            </div>
          </div>

          <!-- BUS TYPE -->
          <div class="form-group">
            <label class="form-label" for="busType">Bus Type</label>
            <div class="input-wrap">
              <i class="fa-solid fa-bus input-icon"></i>
              <select id="busType" class="form-input">
                <option value="">Select Bus Type</option>
                <option value="boys">Boys</option>
                <option value="girls">Girls</option>
                <option value="common">Common</option>
              </select>
            </div>
          </div>

          <div class="divider"></div>

          <!-- TRIP CONTROLS — stacked on mobile, side-by-side on wider screens -->
          <div class="btn-row">
            <button id="startBtn" class="btn-start" onclick="startTrip()">
              <i class="fa-solid fa-play"></i> Start Trip
            </button>
            <button id="endBtn" class="btn-end" onclick="endTrip()" disabled>
              <i class="fa-solid fa-stop"></i> End Trip
            </button>
          </div>

          <button class="btn-logout" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </button>

        </div>
      </div>

    </div>
  </main>

  <footer>&copy; 2026 Commute Assistant</footer>

  <script src="/static/driver.js"></script>

  <!-- Override setStatus to use the styled banner -->
  <script>
  function setStatus(text, color) {
    const banner  = document.getElementById("tripStatus");
    const liveText = banner.querySelector(".status-text-row");
    const subText  = banner.querySelector(".status-sub-text");

    banner.classList.remove("idle", "active", "ended");

    if (color === "#09f443" || color === "green") {
      banner.classList.add("active");
      liveText.innerHTML = 'TRIP ACTIVE <span class="live-dot"></span>';
      subText.textContent = "Broadcasting live location to students";
    } else if (color === "#dc3545" || color === "red") {
      banner.classList.add("ended");
      liveText.innerHTML = "TRIP ENDED";
      subText.textContent = "Trip has been stopped. GPS cleared.";
    } else {
      banner.classList.add("idle");
      liveText.innerHTML = text;
      subText.textContent = "Set route and start tracking";
    }
  }
  </script>

</body>
</html>
