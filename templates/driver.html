<!DOCTYPE html>
<html>
<head>
    <title>Driver Panel</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        .container {
            max-width: 400px;
            margin: auto;
        }

        input, button {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            font-size: 16px;
        }

        button {
            border: none;
            border-radius: 8px;
            cursor: pointer;
        }

        #startBtn {
            background: #28a745;
            color: white;
        }

        #endBtn {
            background: #dc3545;
            color: white;
        }

        #endBtn:disabled {
            background: #999;
        }

        .trip-card {
            padding: 15px;
            font-size: 18px;
            text-align: center;
            background: #6c757d;
            color: white;
            border-radius: 10px;
            margin-bottom: 15px;
        }

        .status-dot {
            height: 10px;
            width: 10px;
            border-radius: 50%;
            display: inline-block;
            margin-left: 8px;
            background: red;
        }

        .online {
            background: #28a745;
        }
    </style>
</head>
<body>

<div class="container">

    <div id="tripStatusCard" class="trip-card">
        TRIP NOT STARTED
        <span id="statusDot" class="status-dot"></span>
    </div>

    <input type="text" id="route" placeholder="Enter Route No">
    <input type="text" id="busType" placeholder="Enter Bus Type">

    <button id="startBtn" onclick="startTrip()">Start Trip</button>
    <button id="endBtn" onclick="endTrip()" disabled>End Trip</button>

</div>

<script src="/static/driver.js"></script>
</body>
</html>
