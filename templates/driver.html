<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Driver Panel – Commute Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --blue: #0a6cdc;
      --blue-light: #3d8ef5;
      --blue-pale: #e8f2ff;
      --teal: #00bfa5;
      --green: #1db97a;
      --red: #ef4444;
      --white: #ffffff;
      --gray-50: #f7faff;
      --gray-100: #edf2fb;
      --gray-200: #d5dfe8;
      --gray-400: #8a9ab5;
      --gray-600: #4a5568;
      --gray-800: #1e2535;
      --navy: #0a2540;
      --shadow-sm: 0 2px 12px rgba(10,44,128,0.07);
      --shadow-md: 0 8px 32px rgba(10,44,128,0.12);
      --shadow-lg: 0 20px 60px rgba(10,44,128,0.18);
      --radius: 16px;
      --radius-sm: 10px;
      --font-display: 'Syne', sans-serif;
      --font-body: 'DM Sans', sans-serif;
      --transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body {
      font-family: var(--font-body);
      background: var(--gray-50);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes pulse {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.7; transform: scale(1.05); }
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* NAVBAR */
    .navbar {
      position: sticky;
      top: 0;
      z-index: 100;
      background: rgba(255,255,255,0.95);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--gray-200);
      padding: 0 32px;
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: var(--shadow-sm);
    }
    .nav-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-family: var(--font-display);
      font-weight: 700;
      font-size: 18px;
      color: var(--navy);
      text-decoration: none;
    }
    .brand-icon {
      width: 34px; height: 34px;
      background: linear-gradient(135deg, var(--blue), var(--teal));
      border-radius: 9px;
      display: flex;
      align-items: center;
      justify-content: center;
      color: white;
      font-size: 15px;
    }
    .nav-right {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .nav-pill {
      padding: 6px 14px;
      border-radius: 50px;
      font-size: 12px;
      font-weight: 500;
    }
    .nav-pill.driver-mode {
      background: #fff3cd;
      color: #b45309;
    }

    /* MAIN */
    main {
      flex: 1;
      display: flex;
      align-items: flex-start;
      justify-content: center;
      padding: 40px 16px 60px;
    }

    .panel-wrapper {
      width: 100%;
      max-width: 460px;
      animation: fadeUp 0.5s ease both;
    }

    /* STATUS BANNER */
    .trip-status-banner {
      border-radius: var(--radius);
      padding: 20px 24px;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 14px;
      font-family: var(--font-display);
      font-size: 18px;
      font-weight: 700;
      transition: var(--transition);
      border: 2px solid transparent;
    }
    .trip-status-banner.idle {
      background: var(--gray-100);
      color: var(--gray-600);
      border-color: var(--gray-200);
    }
    .trip-status-banner.active {
      background: linear-gradient(135deg, #d0f5e7, #b2ece4);
      color: #065f46;
      border-color: #6ee7b7;
    }
    .trip-status-banner.ended {
      background: #fee2e2;
      color: #991b1b;
      border-color: #fca5a5;
    }
    .status-icon {
      width: 44px; height: 44px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      flex-shrink: 0;
    }
    .idle .status-icon { background: var(--gray-200); color: var(--gray-400); }
    .active .status-icon { background: rgba(29,185,122,0.2); color: var(--green); }
    .ended .status-icon { background: rgba(239,68,68,0.12); color: var(--red); }

    .live-dot {
      width: 9px; height: 9px;
      border-radius: 50%;
      background: var(--green);
      animation: blink 1.2s ease-in-out infinite;
      display: none;
    }
    .active .live-dot { display: inline-block; }

    /* CARD */
    .driver-card {
      background: var(--white);
      border-radius: var(--radius);
      border: 1.5px solid var(--gray-200);
      box-shadow: var(--shadow-md);
      overflow: hidden;
    }
    .card-header {
      padding: 24px 28px 0;
      border-bottom: 1px solid var(--gray-100);
      padding-bottom: 20px;
      margin-bottom: 0;
    }
    .card-header h2 {
      font-family: var(--font-display);
      font-size: 20px;
      font-weight: 700;
      color: var(--navy);
      margin-bottom: 4px;
    }
    .card-header p {
      font-size: 13px;
      color: var(--gray-400);
    }
    .card-body { padding: 24px 28px; }

    /* FORM ELEMENTS */
    .form-group { margin-bottom: 18px; }
    .form-label {
      display: block;
      font-size: 12px;
      font-weight: 500;
      color: var(--gray-600);
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 8px;
    }
    .input-wrap { position: relative; }
    .input-icon {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--gray-400);
      font-size: 14px;
      pointer-events: none;
    }
    .form-input {
      width: 100%;
      padding: 13px 16px 13px 42px;
      background: var(--gray-50);
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 15px;
      color: var(--gray-800);
      outline: none;
      transition: var(--transition);
    }
    .form-input:focus {
      border-color: var(--blue);
      background: var(--white);
      box-shadow: 0 0 0 4px rgba(10,108,220,0.08);
    }
    select.form-input { cursor: pointer; }

    .divider { height: 1px; background: var(--gray-100); margin: 20px 0; }

    /* TRIP BUTTONS */
    .btn-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }

    .btn-start {
      padding: 14px;
      background: linear-gradient(135deg, var(--green), #0fa968);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(29,185,122,0.35);
    }
    .btn-start:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(29,185,122,0.5);
    }
    .btn-start:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-end {
      padding: 14px;
      background: linear-gradient(135deg, var(--red), #b91c1c);
      color: white;
      border: none;
      border-radius: var(--radius-sm);
      font-family: var(--font-display);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 16px rgba(239,68,68,0.3);
    }
    .btn-end:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(239,68,68,0.45);
    }
    .btn-end:disabled { opacity: 0.4; cursor: not-allowed; transform: none; }

    .btn-logout {
      width: 100%;
      padding: 13px;
      background: transparent;
      color: var(--gray-400);
      border: 1.5px solid var(--gray-200);
      border-radius: var(--radius-sm);
      font-family: var(--font-body);
      font-size: 14px;
      font-weight: 500;
      cursor: pointer;
      transition: var(--transition);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }
    .btn-logout:hover {
      background: #fee2e2;
      border-color: #fca5a5;
      color: #b91c1c;
    }

    /* GPS indicator */
    .gps-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 12px 16px;
      background: var(--gray-50);
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-sm);
      margin-bottom: 18px;
      font-size: 13px;
      color: var(--gray-600);
    }
    .gps-icon { color: var(--blue); font-size: 14px; }

    footer {
      background: var(--navy);
      color: rgba(255,255,255,0.3);
      text-align: center;
      padding: 16px;
      font-size: 12px;
    }

    @media (max-width: 480px) {
      .navbar { padding: 0 16px; }
      .card-body, .card-header { padding: 20px; }
      .btn-row { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon"><i class="fa-solid fa-bus"></i></div>
      Commute Assistant
    </a>
    <div class="nav-right">
      <span class="nav-pill driver-mode"><i class="fa-solid fa-steering-wheel"></i> &nbsp;Driver Mode</span>
    </div>
  </nav>

  <main>
    <div class="panel-wrapper">

      <!-- TRIP STATUS BANNER -->
      <div id="tripStatus" class="trip-status-banner idle">
        <div class="status-icon"><i class="fa-solid fa-bus-simple"></i></div>
        <div>
          <div style="display:flex;align-items:center;gap:8px;">
            TRIP NOT STARTED
            <span class="live-dot"></span>
          </div>
          <div style="font-size:13px;font-weight:400;opacity:0.65;margin-top:2px;">Set route and start tracking</div>
        </div>
      </div>

      <!-- DRIVER PANEL CARD -->
      <div class="driver-card card">

        <div class="card-header">
          <h2>Driver Trip Panel</h2>
          <p>Configure your route and start sharing live location</p>
        </div>

        <div class="card-body">

          <!-- GPS hint -->
          <div class="gps-bar">
            <i class="fa-solid fa-location-crosshairs gps-icon"></i>
            <span>GPS will activate automatically when you start the trip</span>
          </div>

          <!-- ROUTE -->
          <div class="form-group">
            <label class="form-label" for="route">Route Number</label>
            <div class="input-wrap">
              <i class="fa-solid fa-route input-icon"></i>
              <input id="route" class="form-input" placeholder="e.g. Route 12">
            </div>
          </div>

          <!-- BUS TYPE -->
          <div class="form-group">
            <label class="form-label" for="busType">Bus Type</label>
            <div class="input-wrap">
              <i class="fa-solid fa-bus input-icon"></i>
              <select id="busType" class="form-input">
                <option value="">Select Bus Type</option>
                <option value="boys">Boys</option>
                <option value="girls">Girls</option>
                <option value="common">Common</option>
              </select>
            </div>
          </div>

          <div class="divider"></div>

          <!-- TRIP CONTROLS -->
          <div class="btn-row">
            <button id="startBtn" class="btn-start" onclick="startTrip()">
              <i class="fa-solid fa-play"></i> Start Trip
            </button>
            <button id="endBtn" class="btn-end" onclick="endTrip()" disabled>
              <i class="fa-solid fa-stop"></i> End Trip
            </button>
          </div>

          <button class="btn-logout" onclick="logout()">
            <i class="fa-solid fa-right-from-bracket"></i> Logout
          </button>

        </div>
      </div>

    </div>
  </main>

  <footer>&copy; 2026 Commute Assistant</footer>

  <script src="/static/driver.js"></script>

  <!-- Override setStatus to use the new styled banner -->
  <script>
  function setStatus(text, color) {
    const banner = document.getElementById("tripStatus");
    const liveText = banner.querySelector("div > div:first-child");
    const subText = banner.querySelector("div > div:last-child");

    // Remove all state classes
    banner.classList.remove("idle", "active", "ended");

    if (color === "#09f443" || color === "green") {
      banner.classList.add("active");
      liveText.innerHTML = 'TRIP ACTIVE <span class="live-dot"></span>';
      subText.textContent = "Broadcasting live location to students";
    } else if (color === "#dc3545" || color === "red") {
      banner.classList.add("ended");
      liveText.innerHTML = 'TRIP ENDED';
      subText.textContent = "Trip has been stopped. GPS cleared.";
    } else {
      banner.classList.add("idle");
      liveText.innerHTML = text;
      subText.textContent = "Set route and start tracking";
    }
  }
  </script>

</body>
</html>
