<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Bus Tracking System</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>

<header class="navbar">
  <h1>Bus Tracking System</h1>
</header>

<div class="card">

  <h2>Driver Trip Panel</h2>

  <!-- 🔴 Trip Status Banner -->
  <div id="tripStatus"
       style="background:#dc3545;color:white;padding:10px;border-radius:8px;margin-bottom:10px;text-align:center;">
    TRIP NOT STARTED
  </div>

  <input id="route" placeholder="Route Number">

  <select id="busType">
    <option value="">Select Bus Type</option>
    <option value="boys">Boys</option>
    <option value="girls">Girls</option>
    <option value="common">Common</option>
  </select>

  <button id="startBtn" onclick="startTrip()">Start Trip</button>
  <button id="endBtn" onclick="endTrip()" disabled>End Trip</button>
  <button onclick="logout()">Logout</button>

</div>

<footer class="footer">
  <p>&copy; 2026 College Transport</p>
</footer>

<script src="/static/driver.js"></script>
</body>
</html>
