<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Admin Dashboard – Commute Assistant</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="{{ url_for('static', filename='favicon.ico') }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link rel="stylesheet" href="/static/style.css">
</head>
<body class="page-admin">

  <!-- NAVBAR -->
  <nav class="navbar">
    <a href="/" class="nav-brand">
      <div class="brand-icon"><i class="fa-solid fa-bus"></i></div>
      Commute Assistant
    </a>
    <span class="nav-tag tag-purple">
      <i class="fa-solid fa-shield-halved"></i>&nbsp; Admin
    </span>
  </nav>

  <main>

    <!-- PAGE HEADER -->
    <div class="page-header">
      <div class="page-header-left">
        <h1>Fleet Dashboard</h1>
        <p>Monitor all active buses in real-time</p>
      </div>
      <button class="btn-refresh" onclick="loadBusData()">
        <i class="fa-solid fa-rotate-right spin-icon"></i>
        Refresh Data
      </button>
    </div>

    <!-- STATS STRIP -->
    <div class="stats-strip">
      <div class="stat-card">
        <div class="stat-icon blue"><i class="fa-solid fa-bus"></i></div>
        <div>
          <div class="stat-num" id="statTotal">–</div>
          <div class="stat-lbl">Total Buses</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon green"><i class="fa-solid fa-signal"></i></div>
        <div>
          <div class="stat-num" id="statActive">–</div>
          <div class="stat-lbl">Active Now</div>
        </div>
      </div>
      <div class="stat-card">
        <div class="stat-icon purple"><i class="fa-solid fa-clock"></i></div>
        <div>
          <div class="stat-num" id="statInactive">–</div>
          <div class="stat-lbl">Inactive</div>
        </div>
      </div>
    </div>

    <!-- BUS GRID -->
    <div id="busData">
      <div class="loading-state">
        <div class="spinner"></div>
        <div class="loading-txt">Loading bus data…</div>
      </div>
    </div>

    <div class="last-updated" id="lastUpdated"></div>

  </main>

  <footer>&copy; 2026 Commute Assistant</footer>

  <script>
  console.log("Admin dashboard loaded");

  function timeSince(seconds) {
    if (seconds < 5)  return "just now";
    if (seconds < 60) return `${seconds}s ago`;
    return `${Math.floor(seconds / 60)}m ago`;
  }

  function getBusTypeInfo(type) {
    const map = {
      boys:   { label: "Boys",   icon: "fa-mars",         cls: "type-boys" },
      girls:  { label: "Girls",  icon: "fa-venus",        cls: "type-girls" },
      common: { label: "Common", icon: "fa-people-group", cls: "type-common" }
    };
    return map[type] || { label: type || "Unknown", icon: "fa-bus", cls: "type-common" };
  }

  function loadBusData() {
    const grid = document.getElementById("busData");
    grid.innerHTML = `
      <div class="loading-state">
        <div class="spinner"></div>
        <div class="loading-txt">Fetching live data…</div>
      </div>`;

    fetch("/get_locations")
      .then(r => r.json())
      .then(items => {
        grid.innerHTML = "";

        const total  = items.length;
        const active = items.filter(b => b.active).length;

        document.getElementById("statTotal").textContent    = total;
        document.getElementById("statActive").textContent   = active;
        document.getElementById("statInactive").textContent = total - active;
        document.getElementById("lastUpdated").textContent  =
          `Last updated: ${new Date().toLocaleTimeString()}`;

        if (total === 0) {
          grid.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon"><i class="fa-solid fa-bus-simple"></i></div>
              <h3>No buses registered</h3>
              <p>Buses will appear here once drivers start their trips.</p>
            </div>`;
          return;
        }

        // Sort: active first
        items.sort((a, b) => (b.active ? 1 : 0) - (a.active ? 1 : 0));

        items.forEach((bus, i) => {
          const typeInfo = getBusTypeInfo(bus.busType);
          const isActive = bus.active && bus.lastSeen <= 60;
          const card = document.createElement("div");
          card.className = `bus-card${isActive ? "" : " inactive"}`;
          card.style.animationDelay = `${i * 0.05}s`;

          const statusValueClass = isActive ? "meta-value active-color" : "meta-value inactive-color";

          card.innerHTML = `
            <div class="bus-card-header">
              <div class="bus-route">
                <i class="fa-solid fa-route route-icon"></i>
                Route ${bus.route}
              </div>
              ${isActive
                ? `<span class="bus-status-pill status-live"><span class="dot"></span> Live</span>`
                : `<span class="bus-status-pill status-offline"><i class="fa-solid fa-circle-xmark"></i> Offline</span>`
              }
            </div>

            <div class="bus-meta">
              <div class="meta-item">
                <div class="meta-label">Latitude</div>
                <div class="meta-value mono">${bus.lat != null ? bus.lat.toFixed(5) : "—"}</div>
              </div>
              <div class="meta-item">
                <div class="meta-label">Longitude</div>
                <div class="meta-value mono">${bus.lng != null ? bus.lng.toFixed(5) : "—"}</div>
              </div>
              <div class="meta-item">
                <div class="meta-label">Last Seen</div>
                <div class="meta-value">${timeSince(bus.lastSeen)}</div>
              </div>
              <div class="meta-item">
                <div class="meta-label">Status</div>
                <div class="${statusValueClass}">${isActive ? "Active" : "Inactive"}</div>
              </div>
            </div>

            <span class="type-badge ${typeInfo.cls}">
              <i class="fa-solid ${typeInfo.icon}"></i> ${typeInfo.label} Bus
            </span>
          `;
          grid.appendChild(card);
        });
      })
      .catch(() => {
        document.getElementById("busData").innerHTML = `
          <div class="empty-state">
            <div class="empty-icon"><i class="fa-solid fa-triangle-exclamation"></i></div>
            <h3>Failed to load data</h3>
            <p>Check your connection and try refreshing.</p>
          </div>`;
      });
  }

  loadBusData();
  setInterval(loadBusData, 10000);
  </script>

</body>
</html>
